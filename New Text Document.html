<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Ultra HDR Camera</title>
 
</head>
<body>
  <!-- HOME SCREEN -->
  <section id="home-screen" class="screen active">
    <div class="home-content">
      <div class="brand">ULTRA HDR</div>
      <div class="brand-sub">CAMERA</div>
      <button id="open-camera-btn" class="camera-launch-btn" aria-label="Open Camera">
        <svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </button>
      <p class="home-hint">Tap to capture at maximum quality</p>
    </div>
  </section>

  <!-- CAMERA SCREEN -->
  <section id="camera-screen" class="screen">
    <video id="camera-preview" autoplay playsinline muted></video>
    <div id="grid-overlay" class="grid-overlay hidden" aria-hidden="true"></div>

    <!-- Top bar -->
    <header class="camera-top-bar">
      <button id="close-camera-btn" class="icon-btn" aria-label="Close camera">✕</button>
      <div class="camera-info" id="camera-info">
        <span id="resolution-indicator">Initialising…</span>
        <span id="hdr-badge" class="badge hidden">HDR</span>
        <span id="max-badge" class="badge hidden">MAX</span>
      </div>
      <button id="camera-settings-btn" class="icon-btn" aria-label="Camera settings">⚙</button>
    </header>

    <!-- Zoom bar -->
    <div id="zoom-bar" class="zoom-bar hidden">
      <button id="zoom-out" class="zoom-btn" aria-label="Zoom out">−</button>
      <input id="zoom-slider" type="range" min="1" max="10" step="0.1" value="1" aria-label="Zoom" />
      <button id="zoom-in" class="zoom-btn" aria-label="Zoom in">+</button>
      <span id="zoom-label" class="zoom-label">1.0×</span>
    </div>

    <!-- Quick toggles -->
    <div class="quick-toggles">
      <button id="flash-btn" class="toggle-btn" aria-label="Toggle flash">
        <span class="toggle-icon">⚡</span>
        <span class="toggle-label">Flash</span>
      </button>
      <button id="timer-btn" class="toggle-btn" aria-label="Timer">
        <span class="toggle-icon">⏱</span>
        <span class="toggle-label" id="timer-label">Off</span>
      </button>
      <button id="grid-btn" class="toggle-btn" aria-label="Toggle grid">
        <span class="toggle-icon">▦</span>
        <span class="toggle-label">Grid</span>
      </button>
      <button id="hdr-btn" class="toggle-btn" aria-label="Toggle Ultra HDR">
        <span class="toggle-icon">◐</span>
        <span class="toggle-label">Ultra HDR</span>
      </button>
      <button id="max-res-btn" class="toggle-btn active" aria-label="Toggle max resolution">
        <span class="toggle-icon">◉</span>
        <span class="toggle-label">MAX RES</span>
      </button>
    </div>

    <!-- Bottom controls -->
    <div class="bottom-controls">
      <div class="control-slot left">
        <button id="gallery-btn" class="gallery-btn" aria-label="Last captured photo">
          <img id="gallery-thumb" alt="" />
        </button>
      </div>
      <div class="control-slot center">
        <button id="shutter-btn" class="shutter-btn" aria-label="Capture photo">
          <span class="shutter-inner"></span>
        </button>
      </div>
      <div class="control-slot right">
        <button id="switch-camera-btn" class="icon-btn round" aria-label="Switch camera">⟲</button>
      </div>
    </div>

    <!-- Countdown overlay -->
    <div id="countdown-overlay" class="countdown-overlay hidden" aria-live="assertive">
      <span id="countdown-number"></span>
    </div>

    <!-- Loading overlay -->
    <div id="loading-overlay" class="loading-overlay hidden" aria-live="polite">
      <div class="spinner"></div>
      <span>Capturing…</span>
    </div>
  </section>

  <!-- PREVIEW SCREEN -->
  <section id="preview-screen" class="screen">
    <header class="preview-header">
      <button id="retake-btn" class="text-btn">Retake</button>
      <h2>Preview</h2>
      <button id="close-preview-btn" class="text-btn">Close</button>
    </header>
    <div class="preview-image-container">
      <img id="captured-image" alt="Captured photo" />
    </div>
    <div class="preview-info" id="preview-info"></div>
    <div class="preview-actions">
      <button id="download-btn" class="download-btn">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        DOWNLOAD ORIGINAL PHOTO
      </button>
    </div>
  </section>

  <!-- SETTINGS DRAWER -->
  <aside id="settings-drawer" class="settings-drawer hidden" aria-label="Camera settings">
    <div class="settings-header">
      <h3>Camera Settings</h3>
      <button id="close-settings-btn" class="icon-btn" aria-label="Close settings">✕</button>
    </div>
    <div class="settings-body">
      <label class="settings-row">
        <span>Camera</span>
        <select id="camera-select"></select>
      </label>
      <label class="settings-row">
        <span>Timer</span>
        <select id="timer-select">
          <option value="0">Off</option>
          <option value="3">3 seconds</option>
          <option value="10">10 seconds</option>
        </select>
      </label>
      <label class="settings-row checkbox-row">
        <span>Grid lines</span>
        <input type="checkbox" id="grid-checkbox" />
      </label>
      <label class="settings-row checkbox-row">
        <span>MAX RESOLUTION</span>
        <input type="checkbox" id="max-res-checkbox" checked />
      </label>
      <label class="settings-row checkbox-row">
        <span>ULTRA HDR</span>
        <input type="checkbox" id="hdr-checkbox" />
      </label>
      <div class="settings-note" id="hdr-note"></div>
    </div>
  </aside>

  <!-- TOAST -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
/* ============================================================
   Ultra HDR Camera Web App
   ============================================================
   A mobile-first camera application that:
   - Requests maximum available resolution
   - Uses the Image Capture API when supported
   - Detects and reports HDR / dynamic-range capabilities honestly
   - Preserves the original captured Blob
   - Never silently reduces resolution
   ============================================================ */

(() => {
  'use strict';

  // ---------- DOM ----------
  const $ = (sel) => document.querySelector(sel);

  const elements = {
    homeScreen: $('#home-screen'),
    cameraScreen: $('#camera-screen'),
    previewScreen: $('#preview-screen'),

    openCameraBtn: $('#open-camera-btn'),
    closeCameraBtn: $('#close-camera-btn'),
    closePreviewBtn: $('#close-preview-btn'),
    retakeBtn: $('#retake-btn'),

    video: $('#camera-preview'),
    gridOverlay: $('#grid-overlay'),

    resolutionIndicator: $('#resolution-indicator'),
    hdrBadge: $('#hdr-badge'),
    maxBadge: $('#max-badge'),

    flashBtn: $('#flash-btn'),
    timerBtn: $('#timer-btn'),
    timerLabel: $('#timer-label'),
    gridBtn: $('#grid-btn'),
    hdrBtn: $('#hdr-btn'),
    maxResBtn: $('#max-res-btn'),

    zoomBar: $('#zoom-bar'),
    zoomSlider: $('#zoom-slider'),
    zoomOut: $('#zoom-out'),
    zoomIn: $('#zoom-in'),
    zoomLabel: $('#zoom-label'),

    shutterBtn: $('#shutter-btn'),
    switchCameraBtn: $('#switch-camera-btn'),
    galleryBtn: $('#gallery-btn'),
    galleryThumb: $('#gallery-thumb'),

    cameraSettingsBtn: $('#camera-settings-btn'),
    settingsDrawer: $('#settings-drawer'),
    closeSettingsBtn: $('#close-settings-btn'),
    cameraSelect: $('#camera-select'),
    timerSelect: $('#timer-select'),
    gridCheckbox: $('#grid-checkbox'),
    maxResCheckbox: $('#max-res-checkbox'),
    hdrCheckbox: $('#hdr-checkbox'),
    hdrNote: $('#hdr-note'),

    countdownOverlay: $('#countdown-overlay'),
    countdownNumber: $('#countdown-number'),
    loadingOverlay: $('#loading-overlay'),

    capturedImage: $('#captured-image'),
    previewInfo: $('#preview-info'),
    downloadBtn: $('#download-btn'),

    toast: $('#toast'),
  };

  // ---------- STATE ----------
  const state = {
    stream: null,
    track: null,
    imageCapture: null,
    capabilities: {},
    settings: {},
    videoDevices: [],
    currentDeviceIndex: 0,
    facingMode: 'environment',
    maxResolution: true,
    hdrEnabled: false,
    gridVisible: false,
    flashOn: false,
    timerSeconds: 0,
    zoomValue: 1,
    capturedBlob: null,
    capturedObjectUrl: null,
    galleryObjectUrl: null,
    isCapturing: false,
    toastTimer: null,
  };

  // ---------- UTILITIES ----------
  const delay = (ms) => new Promise((res) => setTimeout(res, ms));

  function showScreen(name) {
    document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
    if (name === 'home') elements.homeScreen.classList.add('active');
    else if (name === 'camera') elements.cameraScreen.classList.add('active');
    else if (name === 'preview') elements.previewScreen.classList.add('active');
  }

  function showToast(message, duration = 3800) {
    clearTimeout(state.toastTimer);
    elements.toast.textContent = message;
    elements.toast.classList.remove('hidden');
    // force reflow then show
    requestAnimationFrame(() => elements.toast.classList.add('visible'));
    state.toastTimer = setTimeout(() => {
      elements.toast.classList.remove('visible');
      setTimeout(() => elements.toast.classList.add('hidden'), 300);
    }, duration);
  }

  function showLoading(show) {
    elements.loadingOverlay.classList.toggle('hidden', !show);
  }

  function formatDate(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}_${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
  }

  function extensionFromMime(mime) {
    const map = {
      'image/jpeg': 'jpg',
      'image/png': 'png',
      'image/webp': 'webp',
      'image/avif': 'avif',
      'image/heic': 'heic',
      'image/heif': 'heif',
    };
    return map[mime] || 'jpg';
  }

  function megapixels(width, height) {
    return (width * height) / 1_000_000;
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
  }

  // ---------- CAMERA START / STOP ----------
  async function openCamera() {
    if (!navigator.mediaDevices?.getUserMedia) {
      showToast('Camera API is not supported in this browser.');
      return;
    }
    showScreen('camera');
    await startStream();
  }

  function stopStream() {
    if (state.stream) {
      state.stream.getTracks().forEach((t) => t.stop());
      state.stream = null;
    }
    state.track = null;
    state.imageCapture = null;
    elements.video.srcObject = null;
  }

  async function startStream(deviceId = null) {
    stopStream();

    const videoConstraints = {
      facingMode: deviceId ? undefined : { ideal: state.facingMode },
      deviceId: deviceId ? { exact: deviceId } : undefined,
      width: { ideal: 4096 },
      height: { ideal: 2160 },
    };

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: videoConstraints,
        audio: false,
      });

      state.stream = stream;
      elements.video.srcObject = stream;
      state.track = stream.getVideoTracks()[0];

      // Capabilities & settings
      state.capabilities = state.track.getCapabilities?.() ?? {};
      state.settings = state.track.getSettings?.() ?? {};

      // Apply maximum resolution if enabled
      if (state.maxResolution) {
        await applyMaxResolution();
      }

      // Image Capture API
      setupImageCapture();

      // UI updates
      updateResolutionIndicator();
      updateControlAvailability();
      updateHDRNote();

      // Enumerate devices (for switching)
      await enumerateVideoDevices();

      // Apply saved zoom
      if (state.capabilities.zoom) {
        await applyZoom(state.zoomValue);
        elements.zoomBar.classList.remove('hidden');
        elements.zoomSlider.min = state.capabilities.zoom.min;
        elements.zoomSlider.max = state.capabilities.zoom.max;
        elements.zoomSlider.step = 0.1;
        elements.zoomSlider.value = state.zoomValue;
      } else {
        elements.zoomBar.classList.add('hidden');
      }
    } catch (err) {
      handleCameraError(err);
    }
  }

  // ---------- MAX RESOLUTION ----------
  async function applyMaxResolution() {
    if (!state.track) return;
    const caps = state.capabilities;
    const constraints = {};

    if (caps.width?.max) constraints.width = { exact: caps.width.max };
    if (caps.height?.max) constraints.height = { exact: caps.height.max };

    if (Object.keys(constraints).length === 0) {
      constraints.width = { ideal: 4096 };
      constraints.height = { ideal: 2160 };
    }

    try {
      await state.track.applyConstraints(constraints);
      state.settings = state.track.getSettings?.() ?? state.settings;
    } catch (e) {
      // Fall back to ideal constraints
      try {
        await state.track.applyConstraints({
          width: { ideal: caps.width?.max ?? 4096 },
          height: { ideal: caps.height?.max ?? 2160 },
        });
        state.settings = state.track.getSettings?.() ?? state.settings;
      } catch (_) {
        // Keep whatever stream we have
      }
    }
    updateResolutionIndicator();
  }

  // ---------- IMAGE CAPTURE ----------
  function setupImageCapture() {
    if (typeof ImageCapture === 'undefined') {
      state.imageCapture = null;
      return;
    }
    try {
      state.imageCapture = new ImageCapture(state.track);
    } catch (e) {
      state.imageCapture = null;
    }
  }

  // ---------- HDR DETECTION ----------
  function isHDRSupported() {
    const caps = state.capabilities || {};
    // Different browsers expose different hints. We check all plausible ones.
    return Boolean(
      caps.hdr === true ||
        caps.dynamicRange ||
        caps.supportedDynamicRange ||
        caps.photoCapabilities?.hdr === true
    );
  }

  function updateHDRNote() {
    if (!elements.hdrNote) return;
    if (isHDRSupported()) {
      elements.hdrNote.textContent =
        'HDR hardware capability detected. The browser will attempt to preserve dynamic range when the capture API allows it.';
    } else {
      elements.hdrNote.textContent =
        'Hardware HDR is not available through this browser. Using the best supported camera mode. No fake HDR processing is applied.';
    }
  }

  // ---------- UI UPDATES ----------
  function updateResolutionIndicator() {
    const w = state.settings.width;
    const h = state.settings.height;
    if (w && h) {
      const mp = megapixels(w, h).toFixed(1);
      elements.resolutionIndicator.textContent = `${w} × ${h}  •  ${mp} MP`;
    } else {
      elements.resolutionIndicator.textContent = 'Resolution unknown';
    }
    elements.maxBadge.classList.toggle('hidden', !state.maxResolution);
    elements.hdrBadge.classList.toggle('hidden', !state.hdrEnabled);
  }

  function updateControlAvailability() {
    // Flash / torch
    const torchSupported = Boolean(state.capabilities.torch);
    elements.flashBtn.disabled = !torchSupported;

    // HDR
    const hdrSupported = isHDRSupported();
    elements.hdrBtn.disabled = !hdrSupported;
    if (!hdrSupported) {
      elements.hdrBtn.classList.remove('active');
      state.hdrEnabled = false;
      elements.hdrCheckbox.checked = false;
      elements.hdrCheckbox.disabled = true;
    } else {
      elements.hdrCheckbox.disabled = false;
    }

    // Grid
    elements.gridOverlay.classList.toggle('hidden', !state.gridVisible);
    elements.gridBtn.classList.toggle('active', state.gridVisible);
    elements.gridCheckbox.checked = state.gridVisible;

    // Timer
    elements.timerLabel.textContent =
      state.timerSeconds === 0 ? 'Off' : `${state.timerSeconds}s`;
    elements.timerBtn.classList.toggle('active', state.timerSeconds > 0);
    elements.timerSelect.value = String(state.timerSeconds);

    // MAX RES
    elements.maxResBtn.classList.toggle('active', state.maxResolution);
    elements.maxResCheckbox.checked = state.maxResolution;

    // HDR button state
    elements.hdrBtn.classList.toggle('active', state.hdrEnabled);
    elements.hdrCheckbox.checked = state.hdrEnabled;
  }

  // ---------- DEVICE ENUMERATION & SWITCHING ----------
  async function enumerateVideoDevices() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      state.videoDevices = devices.filter((d) => d.kind === 'videoinput');

      // Populate settings select
      elements.cameraSelect.innerHTML = '';
      state.videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.textContent = device.label || `Camera ${index + 1}`;
        elements.cameraSelect.appendChild(option);
      });

      // Set current selection
      if (state.track) {
        const currentSettings = state.track.getSettings();
        if (currentSettings.deviceId) {
          elements.cameraSelect.value = currentSettings.deviceId;
        }
      }
    } catch (e) {
      // enumerateDevices may fail in some browsers
    }
  }

  async function switchCamera() {
    if (state.videoDevices.length < 2) {
      showToast('No other cameras available.');
      return;
    }
    state.currentDeviceIndex =
      (state.currentDeviceIndex + 1) % state.videoDevices.length;
    const device = state.videoDevices[state.currentDeviceIndex];
    await startStream(device.deviceId);
  }

  // ---------- ZOOM ----------
  async function applyZoom(value) {
    if (!state.track || !state.capabilities.zoom) return;
    const { min, max } = state.capabilities.zoom;
    const zoom = Math.min(max, Math.max(min, Number(value)));
    try {
      await state.track.applyConstraints({ advanced: [{ zoom }] });
      state.zoomValue = zoom;
      elements.zoomLabel.textContent = `${zoom.toFixed(1)}×`;
    } catch (e) {
      // Zoom not supported in this mode
    }
  }

  // ---------- FLASH ----------
  async function toggleFlash() {
    if (!state.track || !state.capabilities.torch) {
      showToast('Flash / torch is not supported by this camera.');
      return;
    }
    state.flashOn = !state.flashOn;
    try {
      await state.track.applyConstraints({
        advanced: [{ torch: state.flashOn }],
      });
      elements.flashBtn.classList.toggle('active', state.flashOn);
    } catch (e) {
      showToast('Unable to toggle flash.');
      state.flashOn = false;
    }
  }

  // ---------- HDR TOGGLE ----------
  async function toggleHDR() {
    if (!isHDRSupported()) {
      showToast(
        'Hardware HDR is not available through this browser. Using the best supported camera mode.'
      );
      return;
    }

    state.hdrEnabled = !state.hdrEnabled;

    if (state.hdrEnabled) {
      try {
        await state.track.applyConstraints({
          advanced: [{ hdr: true }],
        });
      } catch (e) {
        // Try alternative constraint names
        try {
          await state.track.applyConstraints({
            advanced: [{ dynamicRange: 'HDR' }],
          });
        } catch (_) {
          showToast('This camera does not expose an HDR capture constraint.');
          state.hdrEnabled = false;
        }
      }
    } else {
      try {
        await state.track.applyConstraints({
          advanced: [{ hdr: false }],
        });
      } catch (_) {
        // ignore
      }
    }

    updateControlAvailability();
    updateResolutionIndicator();
  }

  // ---------- TIMER ----------
  function setTimer(seconds) {
    state.timerSeconds = seconds;
    elements.timerLabel.textContent = seconds === 0 ? 'Off' : `${seconds}s`;
    elements.timerBtn.classList.toggle('active', seconds > 0);
    elements.timerSelect.value = String(seconds);
  }

  async function runCountdown(seconds) {
    elements.countdownOverlay.classList.remove('hidden');
    for (let i = seconds; i > 0; i--) {
      elements.countdownNumber.textContent = i;
      await delay(1000);
    }
    elements.countdownOverlay.classList.add('hidden');
  }

  // ---------- CAPTURE ----------
  async function capturePhoto() {
    if (state.isCapturing) return;

    if (state.timerSeconds > 0) {
      await runCountdown(state.timerSeconds);
    }

    state.isCapturing = true;
    showLoading(true);

    try {
      let blob;
      let width;
      let height;
      let format;

      if (state.imageCapture && typeof state.imageCapture.takePhoto === 'function') {
        // ---- Preferred path: Image Capture API ----
        const photoSettings = {};

        // Request the highest still-image dimensions exposed
        const caps = state.capabilities;
        if (caps.width?.max) photoSettings.imageWidth = caps.width.max;
        if (caps.height?.max) photoSettings.imageHeight = caps.height.max;

        // Flash hint when torch is on
        if (state.flashOn && state.capabilities.torch) {
          photoSettings.fillLightMode = 'flash';
        }

        blob = await state.imageCapture.takePhoto(photoSettings);
        format = blob.type || 'image/jpeg';

        // Read actual dimensions from the blob
        const bitmap = await createImageBitmap(blob);
        width = bitmap.width;
        height = bitmap.height;
        bitmap.close();

        // Honest reporting: warn if dimensions are lower than expected
        if (state.maxResolution && caps.width?.max && width < caps.width.max * 0.8) {
          showToast(
            `Captured at ${width}×${height}. The browser did not expose the full ${caps.width.max}×${caps.height.max} sensor resolution. Use the native camera app for maximum detail.`,
            6000
          );
        }
      } else {
        // ---- Fallback: canvas capture ----
        const video = elements.video;
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);

        blob = await new Promise((resolve) =>
          canvas.toBlob(resolve, 'image/jpeg', 1.0)
        );

        if (!blob) throw new Error('Canvas capture failed.');

        width = canvas.width;
        height = canvas.height;
        format = 'image/jpeg';

        showToast(
          `Image Capture API is not available. Captured the live video frame at ${width}×${height}. This may be lower than the full sensor resolution.`,
          6000
        );
      }

      // Store the original Blob — never re-encode
      state.capturedBlob = blob;

      // Revoke previous preview URL
      if (state.capturedObjectUrl) {
        URL.revokeObjectURL(state.capturedObjectUrl);
      }
      state.capturedObjectUrl = URL.createObjectURL(blob);

      // Show preview
      showPreview(state.capturedObjectUrl, width, height, format, blob.size);
    } catch (err) {
      console.error(err);
      showToast(`Capture failed: ${err.message}`);
    } finally {
      state.isCapturing = false;
      showLoading(false);
    }
  }

  // ---------- PREVIEW ----------
  function showPreview(url, width, height, format, size) {
    elements.capturedImage.src = url;

    const mp = megapixels(width, height);
    const formatLabel = format.split('/')[1]?.toUpperCase() || format;

    elements.previewInfo.innerHTML = `
      <div><strong>Dimensions:</strong> ${width} × ${height}</div>
      <div><strong>Megapixels:</strong> ${mp.toFixed(1)} MP</div>
      <div><strong>File size:</strong> ${formatBytes(size)}</div>
      <div><strong>Format:</strong> ${formatLabel}</div>
    `;

    // Update gallery thumbnail
    updateGalleryThumb(url);

    showScreen('preview');
  }

  function updateGalleryThumb(url) {
    if (state.galleryObjectUrl) {
      URL.revokeObjectURL(state.galleryObjectUrl);
    }
    state.galleryObjectUrl = url;
    elements.galleryThumb.src = url;
  }

  // ---------- DOWNLOAD ----------
  function downloadOriginal() {
    if (!state.capturedBlob) {
      showToast('No photo to download.');
      return;
    }

    const ext = extensionFromMime(state.capturedBlob.type);
    const filename = `UltraHDR_${formatDate(new Date())}.${ext}`;

    // Create a fresh object URL for the download to avoid revoking the preview URL
    const downloadUrl = URL.createObjectURL(state.capturedBlob);

    const a = document.createElement('a');
    a.href = downloadUrl;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();

    // Revoke later — the browser needs time to start the download
    setTimeout(() => URL.revokeObjectURL(downloadUrl), 15_000);

    showToast(`Downloading original ${ext.toUpperCase()} (${formatBytes(state.capturedBlob.size)})…`);
  }

  // ---------- ERROR HANDLING ----------
  function handleCameraError(err) {
    let message = 'Unable to access the camera.';

    switch (err.name) {
      case 'NotAllowedError':
      case 'PermissionDeniedError':
        message =
          'Camera permission was denied. Please allow camera access in your browser settings and try again.';
        break;
      case 'NotFoundError':
      case 'DevicesNotFoundError':
        message = 'No camera was found on this device.';
        break;
      case 'NotReadableError':
      case 'TrackStartError':
        message =
          'The camera is already in use by another application. Close other apps and try again.';
        break;
      case 'OverconstrainedError':
        message =
          'The requested resolution is not supported by this camera. Try toggling MAX RESOLUTION off.';
        break;
      case 'SecurityError':
        message =
          'Camera access requires a secure context (HTTPS or localhost).';
        break;
      default:
        message = `Camera error: ${err.message || err.name}`;
    }

    showToast(message, 6000);
    showScreen('home');
  }

  // ---------- EVENT BINDINGS ----------
  function bindEvents() {
    // Home → Camera
    elements.openCameraBtn.addEventListener('click', openCamera);

    // Close camera
    elements.closeCameraBtn.addEventListener('click', () => {
      stopStream();
      showScreen('home');
    });

    // Shutter
    elements.shutterBtn.addEventListener('click', capturePhoto);

    // Switch camera
    elements.switchCameraBtn.addEventListener('click', switchCamera);

    // Flash
    elements.flashBtn.addEventListener('click', toggleFlash);

    // Timer
    elements.timerBtn.addEventListener('click', () => {
      const order = [0, 3, 10];
      const next = order[(order.indexOf(state.timerSeconds) + 1) % order.length];
      setTimer(next);
    });

    // Grid
    elements.gridBtn.addEventListener('click', () => {
      state.gridVisible = !state.gridVisible;
      updateControlAvailability();
    });

    // HDR
    elements.hdrBtn.addEventListener('click', toggleHDR);

    // MAX RES toggle
    elements.maxResBtn.addEventListener('click', async () => {
      state.maxResolution = !state.maxResolution;
      if (state.maxResolution) {
        await applyMaxResolution();
      } else {
        // Revert to default stream constraints
        await startStream(
          state.track?.getSettings()?.deviceId || undefined
        );
      }
      updateControlAvailability();
      updateResolutionIndicator();
    });

    // Zoom
    elements.zoomSlider.addEventListener('input', (e) => {
      applyZoom(e.target.value);
    });
    elements.zoomOut.addEventListener('click', () => {
      applyZoom(Math.max(state.capabilities.zoom?.min ?? 1, state.zoomValue - 0.5));
      elements.zoomSlider.value = state.zoomValue;
    });
    elements.zoomIn.addEventListener('click', () => {
      applyZoom(Math.min(state.capabilities.zoom?.max ?? 10, state.zoomValue + 0.5));
      elements.zoomSlider.value = state.zoomValue;
    });

    // Preview actions
    elements.retakeBtn.addEventListener('click', () => {
      showScreen('camera');
      // Revoke preview URL? Keep for gallery
    });

    elements.closePreviewBtn.addEventListener('click', () => {
      showScreen('camera');
    });

    elements.downloadBtn.addEventListener('click', downloadOriginal);

    // Gallery → show last photo
    elements.galleryBtn.addEventListener('click', () => {
      if (state.capturedBlob && state.capturedObjectUrl) {
        // Re-derive dimensions lazily
        const img = new Image();
        img.onload = () => {
          showPreview(
            state.capturedObjectUrl,
            img.naturalWidth,
            img.naturalHeight,
            state.capturedBlob.type,
            state.capturedBlob.size
          );
        };
        img.src = state.capturedObjectUrl;
      }
    });

    // Settings drawer
    elements.cameraSettingsBtn.addEventListener('click', () => {
      elements.settingsDrawer.classList.remove('hidden');
      updateHDRNote();
    });

    elements.closeSettingsBtn.addEventListener('click', () => {
      elements.settingsDrawer.classList.add('hidden');
    });

    // Settings controls
    elements.cameraSelect.addEventListener('change', async (e) => {
      const deviceId = e.target.value;
      await startStream(deviceId);
    });

    elements.timerSelect.addEventListener('change', (e) => {
      setTimer(Number(e.target.value));
    });

    elements.gridCheckbox.addEventListener('change', (e) => {
      state.gridVisible = e.target.checked;
      updateControlAvailability();
    });

    elements.maxResCheckbox.addEventListener('change', async (e) => {
      state.maxResolution = e.target.checked;
      if (state.maxResolution) {
        await applyMaxResolution();
      } else {
        await startStream(state.track?.getSettings()?.deviceId || undefined);
      }
      updateControlAvailability();
      updateResolutionIndicator();
    });

    elements.hdrCheckbox.addEventListener('change', () => {
      // Delegate to the same toggle logic
      toggleHDR();
    });

    // Keyboard shortcut (desktop)
    document.addEventListener('keydown', (e) => {
      if (elements.cameraScreen.classList.contains('active')) {
        if (e.key === ' ' || e.key === 'Enter') {
          e.preventDefault();
          capturePhoto();
        } else if (e.key === 'Escape') {
          elements.closeCameraBtn.click();
        }
      }
    });
  }

  // ---------- INIT ----------
  function init() {
    bindEvents();

    // Check secure context
    if (!window.isSecureContext && location.hostname !== 'localhost') {
      // We still allow the UI, but warn on camera access
      console.warn('Not a secure context. Camera access may be blocked.');
    }

    // Initial UI state
    updateControlAvailability();

    // Prevent accidental pull-to-refresh interfering with camera (optional)
    document.addEventListener(
      'touchmove',
      (e) => {
        if (elements.cameraScreen.classList.contains('active')) {
          // Allow default scrolling only in settings drawer
          if (!elements.settingsDrawer.contains(e.target)) {
            e.preventDefault();
          }
        }
      },
      { passive: false }
    );
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
<style>
/* ============ RESET & BASE ============ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0a0a0a;
  --surface: #141414;
  --surface-2: #1e1e1e;
  --border: #2a2a2a;
  --text: #f5f5f5;
  --text-dim: #9a9a9a;
  --gold: #d4af37;
  --blue: #00b4ff;
  --danger: #ff4d4d;
  --radius: 14px;
  --radius-sm: 10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

.hidden { display: none !important; }

/* ============ SCREENS ============ */
.screen {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  background: var(--bg);
  z-index: 1;
}
.screen.active {
  display: flex;
}

/* ============ HOME SCREEN ============ */
.home-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 24px;
  text-align: center;
}

.brand {
  font-size: clamp(2rem, 8vw, 3rem);
  font-weight: 800;
  letter-spacing: 0.22em;
  color: var(--gold);
  text-transform: uppercase;
}
.brand-sub {
  font-size: clamp(0.9rem, 3vw, 1.2rem);
  letter-spacing: 0.6em;
  color: var(--text-dim);
  margin-top: -12px;
}

.camera-launch-btn {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 30% 30%, #2a2a2a, #0f0f0f);
  border: 1px solid var(--border);
  color: var(--gold);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 0 0 1px rgba(212,175,55,0.15), 0 12px 40px rgba(0,0,0,0.6);
}
.camera-launch-btn:active {
  transform: scale(0.94);
  box-shadow: 0 0 0 1px rgba(212,175,55,0.35), 0 6px 24px rgba(0,0,0,0.8);
}

.home-hint {
  color: var(--text-dim);
  font-size: 0.9rem;
  letter-spacing: 0.04em;
}

/* ============ CAMERA SCREEN ============ */
#camera-preview {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: #000;
  z-index: 0;
}

.grid-overlay {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.18) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.18) 1px, transparent 1px);
  background-size: 33.33% 33.33%;
  background-position: -1px -1px;
}

/* Top bar */
.camera-top-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(12px + var(--safe-top)) 14px 12px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: rgba(20,20,20,0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 1.1rem;
  color: var(--text);
  transition: background 0.2s;
}
.icon-btn:active { background: rgba(40,40,40,0.8); }
.icon-btn.round { font-size: 1.4rem; }

.camera-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  color: var(--text-dim);
  background: rgba(10,10,10,0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.08);
}
#resolution-indicator {
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.badge {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 2px 7px;
  border-radius: 4px;
  text-transform: uppercase;
}
#hdr-badge {
  background: linear-gradient(135deg, var(--gold), #f0d060);
  color: #000;
}
#max-badge {
  background: var(--blue);
  color: #000;
}

/* Zoom bar */
.zoom-bar {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border-radius: 999px;
  background: rgba(10,10,10,0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.1);
  width: min(300px, 80vw);
}
.zoom-btn {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  font-size: 1.1rem;
  display: grid;
  place-items: center;
}
#zoom-slider {
  flex: 1;
  accent-color: var(--gold);
  height: 4px;
}
.zoom-label {
  font-size: 0.75rem;
  color: var(--gold);
  min-width: 36px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Quick toggles */
.quick-toggles {
  position: absolute;
  bottom: calc(150px + var(--safe-bottom));
  left: 0;
  right: 0;
  z-index: 5;
  display: flex;
  justify-content: center;
  gap: 6px;
  padding: 0 10px;
  flex-wrap: wrap;
}

.toggle-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  background: rgba(20,20,20,0.55);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.1);
  min-width: 62px;
  transition: border-color 0.2s, background 0.2s;
}
.toggle-btn.active {
  border-color: var(--gold);
  background: rgba(212,175,55,0.15);
}
.toggle-btn:disabled {
  opacity: 0.35;
  pointer-events: none;
}
.toggle-icon {
  font-size: 1.1rem;
  line-height: 1;
}
.toggle-label {
  font-size: 0.6rem;
  letter-spacing: 0.03em;
  color: var(--text-dim);
  text-transform: uppercase;
  white-space: nowrap;
}
.toggle-btn.active .toggle-label {
  color: var(--gold);
}

/* Bottom controls */
.bottom-controls {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 14px 24px calc(22px + var(--safe-bottom));
  background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
}

.control-slot { display: flex; align-items: center; }
.control-slot.left { justify-content: flex-start; }
.control-slot.center { justify-content: center; }
.control-slot.right { justify-content: flex-end; }

.gallery-btn {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 2px solid rgba(255,255,255,0.2);
  background: var(--surface-2);
}
.gallery-btn img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}
.gallery-btn img[src] { display: block; }
.gallery-btn:empty::after {
  content: "▣";
  display: grid;
  place-items: center;
  width: 100%;
  height: 100%;
  color: var(--text-dim);
  font-size: 1.2rem;
}

.shutter-btn {
  width: 82px;
  height: 82px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.85);
  display: grid;
  place-items: center;
  transition: transform 0.1s ease;
  background: transparent;
}
.shutter-btn:active { transform: scale(0.92); }
.shutter-inner {
  width: 66px;
  height: 66px;
  border-radius: 50%;
  background: #fff;
  transition: background 0.2s, transform 0.1s;
}
.shutter-btn:active .shutter-inner {
  background: var(--gold);
  transform: scale(0.9);
}

/* Countdown */
.countdown-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
}
#countdown-number {
  font-size: 8rem;
  font-weight: 800;
  color: var(--gold);
  text-shadow: 0 0 40px rgba(212,175,55,0.5);
  animation: pulse 1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.12); opacity: 0.8; }
}

/* Loading */
.loading-overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: var(--text);
  font-size: 0.9rem;
  letter-spacing: 0.06em;
}
.spinner {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 3px solid rgba(255,255,255,0.15);
  border-top-color: var(--gold);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============ PREVIEW SCREEN ============ */
.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(12px + var(--safe-top)) 16px 12px;
  border-bottom: 1px solid var(--border);
}
.preview-header h2 {
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.text-btn {
  color: var(--gold);
  font-size: 0.9rem;
  font-weight: 600;
  padding: 6px 4px;
}

.preview-image-container {
  flex: 1;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #000;
  padding: 12px;
}
#captured-image {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: var(--radius-sm);
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}

.preview-info {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 6px 18px;
  padding: 14px 16px;
  font-size: 0.78rem;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  font-variant-numeric: tabular-nums;
}
.preview-info div {
  display: flex;
  align-items: center;
  gap: 4px;
}

.preview-actions {
  padding: 12px 16px calc(20px + var(--safe-bottom));
  border-top: 1px solid var(--border);
}

.download-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, var(--gold), #b8962e);
  color: #000;
  font-weight: 800;
  font-size: 0.82rem;
  letter-spacing: 0.08em;
  transition: filter 0.2s, transform 0.1s;
}
.download-btn:active { transform: scale(0.98); filter: brightness(0.92); }

/* ============ SETTINGS DRAWER ============ */
.settings-drawer {
  position: fixed;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(340px, 88vw);
  z-index: 20;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  box-shadow: -12px 0 40px rgba(0,0,0,0.5);
  animation: slideIn 0.25s ease;
}
@keyframes slideIn {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}
.settings-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: calc(16px + var(--safe-top)) 16px 16px;
  border-bottom: 1px solid var(--border);
}
.settings-header h3 {
  font-size: 0.9rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
}
.settings-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow-y: auto;
}
.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.9rem;
  gap: 12px;
}
.settings-row select {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 0.85rem;
  max-width: 60%;
}
.checkbox-row input[type="checkbox"] {
  width: 22px;
  height: 22px;
  accent-color: var(--gold);
}
.settings-note {
  margin-top: 16px;
  font-size: 0.72rem;
  line-height: 1.5;
  color: var(--text-dim);
  padding: 12px;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--gold);
}

/* ============ TOAST ============ */
.toast {
  position: fixed;
  bottom: calc(24px + var(--safe-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 30;
  max-width: min(90vw, 420px);
  padding: 12px 20px;
  border-radius: 999px;
  background: rgba(30,30,30,0.95);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--border);
  font-size: 0.8rem;
  line-height: 1.4;
  text-align: center;
  color: var(--text);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
}
.toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}

/* ============ RESPONSIVE ============ */
@media (min-width: 768px) {
  .camera-launch-btn { width: 180px; height: 180px; }
  .shutter-btn { width: 96px; height: 96px; }
  .shutter-inner { width: 78px; height: 78px; }
  .toggle-btn { min-width: 72px; padding: 10px 14px; }
  .quick-toggles { bottom: calc(170px + var(--safe-bottom)); }
  .preview-image-container { padding: 24px; }
  .preview-info { font-size: 0.85rem; gap: 8px 28px; }
  .download-btn { max-width: 480px; margin: 0 auto; }
}

@media (min-width: 1024px) {
  .camera-top-bar { padding: 18px 28px; }
  .bottom-controls { padding: 24px 48px; }
  .preview-actions { padding: 16px 48px 28px; }
}
</style>
</html>
